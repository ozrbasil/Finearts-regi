# Render Blueprint: deploys the Node server from this GitHub repo.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: fine-arts-registration
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_NAME
        value: fine_arts
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TEAM1_PASSWORD
        sync: false
      - key: TEAM2_PASSWORD
        sync: false
      - key: TEAM3_PASSWORD
        sync: false
      - key: TEAM4_PASSWORD
        sync: false
