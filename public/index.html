<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine Arts Registration - Login</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login">
  <div class="login-card">
    <h1>Fine Arts Registration</h1>
    <p class="sub">Sign in with your team username and password.</p>
    <form id="teamForm" autocomplete="off">
      <label>Username<input type="text" id="lUser" required></label>
      <label>Password<input type="password" id="lPass" required></label>
      <div class="error" id="lErr"></div>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <div class="links"><a href="admin.html">Admin login</a></div>
  </div>
</section>

<div id="toast"></div>

<script src="common.js"></script>
<script>
  if (getSession()?.role === "team") location.replace("user.html");

  $("teamForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("lErr").textContent = "";
    try {
      const r = await api("POST", "/api/login", { username: $("lUser").value.trim(), password: $("lPass").value });
      setSession({ token: r.token, role: "team", team: r.team, username: r.username });
      location.replace("user.html");
    } catch (err) {
      $("lErr").textContent = err.message;
      $("lPass").value = "";
    }
  });
</script>
</body>
</html>
